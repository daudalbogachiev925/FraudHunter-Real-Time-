name: CI
on: { push: { branches: [main] }, pull_request: }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install xgboost scikit-learn pytest fastapi httpx
      - run: pytest -q tests/
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker build -t fh-stream:${{ github.sha }} ./stream
          docker build -t fh-api:${{ github.sha }} ./api
          docker build -t fh-model:${{ github.sha }} ./model
